# Nixpacks config — Railway uses this to build the app
# Build with Node.js (Next.js Turbopack needs worker_threads which Bun doesn't support)

[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = [
  "bun install",
  "cd mini-services/otc-engine && bun install && cd ../..",
  "bunx prisma generate"
]

[phases.build]
# Use Node.js (npx) for build — Turbopack works with Node but not Bun
# Limit memory to 512MB to fit Railway's plan
cmds = [
  "NEXT_TELEMETRY_DISABLED=1 NODE_OPTIONS='--max-old-space-size=512' npx next build",
  "cp -r .next/static .next/standalone/.next/ 2>/dev/null || true",
  "cp -r public .next/standalone/ 2>/dev/null || true"
]

[start]
# Use bun to run the standalone server (works without node at runtime)
cmd = "bash railway-start.sh"
