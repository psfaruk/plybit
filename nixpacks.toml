# Nixpacks config — Railway uses this to build AND run the app

[phases.setup]
nixPkgs = ["nodejs_20", "bun"]
aptPkgs = ["openssl", "libssl3", "ca-certificates", "curl"]

[phases.install]
cmds = [
  "bun install",
  "cd mini-services/otc-engine && bun install && cd ../..",
  "bunx prisma generate"
]

[phases.build]
# Build with Node.js — Turbopack needs worker_threads which Bun lacks
cmds = [
  "NEXT_TELEMETRY_DISABLED=1 NODE_OPTIONS='--max-old-space-size=512' npx next build"
]

[start]
cmd = "bash railway-start.sh"
