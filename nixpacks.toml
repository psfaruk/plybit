# Nixpacks config — Railway uses this to build the app
# Optimized for LOW memory + Bun runtime (no node needed at runtime)

[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = [
  "bun install",
  "cd mini-services/otc-engine && bun install && cd ../..",
  "bunx prisma generate"
]

[phases.build]
# Build with Node.js (Bun doesn't support Turbopack worker_threads)
# Then verify the build output exists
cmds = [
  "NEXT_TELEMETRY_DISABLED=1 NEXT_PRIVATE_LOCAL_WEBPACK_WORKER=0 NODE_OPTIONS='--max-old-space-size=512' npx next build --no-turbo",
  "ls -la .next/ || echo 'WARNING: .next directory missing!'",
  "ls -la .next/standalone/ 2>/dev/null || echo 'NOTE: standalone not created (using next start instead)'"
]

[start]
cmd = "bash railway-start.sh"
