# Nixpacks config — Railway uses this to build AND run the app
# Dockerfile deleted so Railway MUST use this

[phases.setup]
nixPkgs = ["nodejs_20", "bun"]
# CRITICAL: libssl3 needed by Prisma at RUNTIME (not just build)
# Without this, Prisma throws: "libssl.so.3: cannot open shared object file"
aptPkgs = ["openssl", "libssl3", "ca-certificates", "curl"]

[phases.install]
cmds = [
  "bun install",
  "cd mini-services/otc-engine && bun install && cd ../..",
  "bunx prisma generate"
]

[phases.build]
# Build with Node.js (npx) — Turbopack needs worker_threads which Bun lacks
cmds = [
  "NEXT_TELEMETRY_DISABLED=1 NODE_OPTIONS='--max-old-space-size=512' npx next build",
  "cp -r .next/static .next/standalone/.next/ 2>/dev/null || true",
  "cp -r public .next/standalone/ 2>/dev/null || true",
  "cp -r node_modules/.prisma .next/standalone/node_modules/.prisma 2>/dev/null || true",
  "cp -r node_modules/@prisma .next/standalone/node_modules/@prisma 2>/dev/null || true"
]

[start]
cmd = "bash railway-start.sh"
